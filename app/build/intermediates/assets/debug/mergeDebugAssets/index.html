<html lang="zh-CN">
<head>

  <style>
    @media(max-width:430px){.panel-title span{display:none}.panel-title{flex:0 0 auto}.panel-tools{gap:4px;flex:1;justify-content:flex-end;min-width:0}.tool-pill{padding:0 7px;font-size:10px;white-space:nowrap;flex:0 0 auto}.panel-top{gap:6px}.panel-title strong{font-size:11px}}
    :root{color-scheme:dark;--ink:#f6f5ef;--muted:#a2a59f;--panel:rgba(19,21,19,.82);--line:rgba(255,255,255,.12);--accent:#d9f36a;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#101210;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{color:inherit;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.app{position:relative;width:100%;height:100%;height:100dvh;overflow:hidden;background:#000;isolation:isolate}.camera,.camera-fallback{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(var(--bg-zoom,1));transition:transform .14s ease-out;background:#252824}.camera{display:none;inset:auto;left:50%;top:50%;width:min(100vw,56.25dvh);height:min(100dvh,177.7778vw);object-fit:contain;transform:translate(-50%,-50%) scale(var(--bg-zoom,1));background:#000}.camera.ready{display:block}.camera-fallback{display:grid;place-items:center;background:radial-gradient(ellipse at 48% 42%,#454b43 0,#282d28 40%,#171a17 78%)}.fallback-grid{position:absolute;inset:0;opacity:.18;background-image:linear-gradient(rgba(226,232,210,.22) 1px,transparent 1px),linear-gradient(90deg,rgba(226,232,210,.22) 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(to bottom,transparent,black 25%,black 75%,transparent)}.fallback-copy{position:relative;text-align:center;display:grid;gap:10px;justify-items:center;color:#d9ddd3}.camera-mark{width:58px;height:58px;border:1px solid #979d8e;border-radius:50%;display:grid;place-items:center;color:var(--accent);font-size:23px}.fallback-copy strong{font-size:14px;font-weight:600;letter-spacing:.04em}.fallback-copy span{font-size:12px;color:#a5aa9e}.stage-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,12,10,.58),transparent 20%,transparent 66%,rgba(10,12,10,.56));pointer-events:none}.topbar{position:absolute;z-index:5;top:calc(var(--safe-top) + 12px);left:16px;right:16px;height:48px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:650;letter-spacing:.02em}.brand-symbol{width:27px;height:27px;border:1px solid rgba(255,255,255,.48);border-radius:9px;display:grid;place-items:center;color:var(--accent);font-size:13px}.top-actions{display:flex;gap:8px}.icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(18,20,18,.58);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(12px);font-size:18px}.icon-btn svg,.action-icon svg,.import-button svg,.float-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.side-rail{position:absolute;z-index:5;top:27%;bottom:27%;display:flex;align-items:center;justify-content:center;width:48px}.side-rail.left{left:8px}.side-rail.right{right:8px}.slider-shell{height:min(35vh,250px);width:42px;border:1px solid rgba(255,255,255,.14);border-radius:24px;background:var(--panel);backdrop-filter:blur(18px);display:flex;align-items:center;justify-content:center;position:relative}.vertical-range{appearance:none;-webkit-appearance:none;width:148px;height:3px;transform:rotate(-90deg);background:linear-gradient(90deg,var(--accent) 0 50%,rgba(255,255,255,.24) 50%);border-radius:6px;position:absolute;top:50%;left:50%;margin:0;transform-origin:center;translate:-50% -50%}.vertical-range::-webkit-slider-thumb{appearance:none;width:17px;height:17px;border:3px solid #161916;border-radius:50%;background:var(--accent);box-shadow:0 0 0 1px rgba(255,255,255,.6)}.vertical-range::-moz-range-thumb{width:12px;height:12px;border:3px solid #161916;border-radius:50%;background:var(--accent)}.rail-label{position:absolute;top:-27px;color:#f4f5ed;font-size:10px;letter-spacing:.05em;white-space:nowrap}.rail-value{position:absolute;bottom:-26px;font-size:10px;color:#e7e9e1;font-variant-numeric:tabular-nums}.rail-glyph{position:absolute;bottom:-51px;font-size:13px;color:#bdc1b7}.image-layer{position:absolute;z-index:2;left:50%;top:47%;width:min(68vw,360px);height:min(48vh,440px);transform:translate(-50%,-50%);transform-origin:center center;touch-action:none;user-select:none;display:none;cursor:grab}.image-layer.visible{display:block}.image-layer:active{cursor:grabbing}.overlay-image{width:100%;height:100%;object-fit:fill;opacity:var(--image-opacity,.7);filter:drop-shadow(0 14px 26px rgba(0,0,0,.3));pointer-events:none}.warp-canvas{position:absolute;inset:0;z-index:2;width:100%;height:100%;display:none;pointer-events:none}.perspective-layer{position:absolute;inset:0;z-index:4;pointer-events:none;display:none}.perspective-handle{position:absolute;width:32px;height:32px;margin:-16px 0 0 -16px;border:2px solid #18200b;border-radius:50%;background:var(--accent);box-shadow:0 2px 12px rgba(0,0,0,.6);pointer-events:auto;touch-action:none}.perspective-handle::after{content:"";position:absolute;inset:9px;border-radius:50%;background:#202610}.perspective-mode .perspective-layer{display:block}.perspective-mode .warp-canvas{display:block}.perspective-mode .image-layer{visibility:hidden;pointer-events:none}.perspective-mode .perspective-layer{pointer-events:auto}.perspective-mode .center-status,.perspective-on .center-status{background:rgba(217,243,106,.95);color:#1d2310;border-color:transparent}.perspective-on .image-layer{visibility:hidden;pointer-events:none}.perspective-on .warp-canvas{display:block}.perspective-mode .perspective-handle{pointer-events:auto}.points-layer{position:absolute;inset:0;z-index:3;pointer-events:none}.point-marker{position:absolute;width:29px;height:29px;display:grid;place-items:center;border-radius:50%;border:2px solid #11150e;background:var(--accent);color:#18200b;font-size:12px;font-weight:800;box-shadow:0 2px 12px rgba(0,0,0,.42);transform:translate(-50%,-50%);animation:pop .18s ease-out}.point-mode .canvas-hit{position:absolute;z-index:4;inset:0;cursor:crosshair}.canvas-hit{position:absolute;inset:0;z-index:1;touch-action:none}.image-layer{z-index:2}.point-mode .image-layer{pointer-events:none}@keyframes pop{from{scale:.65;opacity:.5}to{scale:1;opacity:1}}.import-empty{position:absolute;z-index:4;left:50%;top:50%;transform:translate(-50%,-50%);display:grid;justify-items:center;gap:12px;text-align:center;transition:opacity .2s}.import-empty.hidden{opacity:0;pointer-events:none}.import-button{height:48px;padding:0 18px;border-radius:15px;background:var(--accent);color:#1a2010;display:flex;align-items:center;gap:9px;font-size:14px;font-weight:750;box-shadow:0 8px 26px rgba(0,0,0,.25)}.import-button:hover{background:#e4f99c}.import-hint{font-size:11px;color:rgba(255,255,255,.76);text-shadow:0 1px 5px #000}.center-status{position:absolute;z-index:5;left:50%;top:calc(var(--safe-top) + 72px);transform:translateX(-50%);padding:7px 12px;border:1px solid rgba(255,255,255,.12);border-radius:20px;background:rgba(16,18,16,.55);backdrop-filter:blur(10px);font-size:11px;color:#e4e7dd;white-space:nowrap;display:flex;align-items:center;gap:7px}.status-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}.point-mode .center-status{background:rgba(217,243,106,.95);color:#1d2310;border-color:transparent}.point-mode .status-dot{background:#37421b;box-shadow:none}.bottom-panel{position:absolute;z-index:6;left:14px;right:14px;bottom:calc(var(--safe-bottom) + 14px);padding:11px 12px 10px;border:1px solid rgba(255,255,255,.13);border-radius:23px;background:rgba(17,19,17,.86);backdrop-filter:blur(24px);box-shadow:0 16px 54px rgba(0,0,0,.25)}.panel-top{height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 3px 9px;border-bottom:1px solid var(--line)}.panel-title{display:flex;align-items:baseline;gap:8px}.panel-title strong{font-size:12px;font-weight:650}.panel-title span{font-size:10px;color:var(--muted)}.panel-tools{display:flex;gap:7px}.tool-pill{height:29px;padding:0 10px;border-radius:12px;background:rgba(255,255,255,.08);font-size:11px;color:#e6e8df}.tool-pill.active{color:#202610;background:var(--accent)}.tool-pill:disabled{opacity:.4;cursor:not-allowed}.size-row{display:flex;align-items:center;gap:10px;height:43px;padding:2px 3px 1px}.size-icon{font-size:12px;color:#d4d8cd}.size-range{appearance:none;-webkit-appearance:none;flex:1;height:3px;border-radius:4px;background:linear-gradient(90deg,var(--accent) 0 38%,rgba(255,255,255,.23) 38%)}.size-range::-webkit-slider-thumb{appearance:none;width:15px;height:15px;border-radius:50%;background:#f3f4ee;border:3px solid #252923;box-shadow:0 0 0 1px rgba(255,255,255,.4)}.size-range::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:#f3f4ee;border:3px solid #252923}.size-value{font-size:10px;color:#c2c6bc;width:31px;text-align:right;font-variant-numeric:tabular-nums}.toolbar{height:57px;display:grid;grid-template-columns:repeat(4,1fr);align-items:end}.action{display:flex;flex-direction:column;align-items:center;gap:5px;color:#aeb2a8;font-size:9px;font-weight:550;letter-spacing:.02em}.action-icon{width:38px;height:34px;border-radius:13px;display:grid;place-items:center;color:#eef0e8}.action.selected{color:var(--accent)}.action.selected .action-icon{background:rgba(217,243,106,.13);color:var(--accent)}.action.capture .action-icon{height:44px;width:44px;border-radius:50%;border:1px solid rgba(255,255,255,.62);background:#f1f2ed;color:#282d22;margin-top:-10px}.action.capture .action-icon svg{width:16px;height:16px;fill:#e15d51;stroke:#e15d51}.action:active .action-icon{transform:scale(.94)}.toast{position:absolute;z-index:10;bottom:calc(var(--safe-bottom) + 166px);left:50%;transform:translate(-50%,10px);padding:10px 14px;border-radius:14px;background:#f1f3e9;color:#1e221a;font-size:12px;opacity:0;pointer-events:none;transition:.2s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}.file-input{display:none}.point-mode .canvas-hit{pointer-events:auto}.point-mode .bottom-panel{border-color:rgba(217,243,106,.42)}.point-mode .image-layer{cursor:crosshair}@media(min-width:700px){.app{max-width:520px;margin:auto;border-left:1px solid #353a32;border-right:1px solid #353a32}.side-rail.left{left:14px}.side-rail.right{right:14px}.bottom-panel{left:22px;right:22px;bottom:22px}.camera-fallback{background:radial-gradient(ellipse at 50% 43%,#50564c 0,#292e28 46%,#171a17 85%)}}
    .guide-grid,.horizon-line{position:absolute;inset:0;z-index:3;width:100%;height:100%;pointer-events:none;display:none}.app.show-grid .guide-grid,.app.show-horizon .horizon-line{display:block}.horizon-line{inset:50% 0 auto;height:1px;background:rgba(217,243,106,.9);box-shadow:0 0 4px rgba(0,0,0,.7)}.settings-panel{position:absolute;z-index:7;top:calc(var(--safe-top) + 62px);right:16px;width:min(260px,calc(100vw - 32px));padding:14px;border:1px solid rgba(255,255,255,.14);border-radius:18px;background:rgba(17,19,17,.95);backdrop-filter:blur(22px);box-shadow:0 12px 38px rgba(0,0,0,.38)}.settings-panel[hidden]{display:none}.settings-heading{margin:0 0 9px;font-size:12px;font-weight:650;color:#f2f4eb}.setting-row{display:flex;align-items:center;justify-content:space-between;min-height:42px;border-top:1px solid var(--line);font-size:12px;color:#e6e8df}.setting-row input{width:18px;height:18px;accent-color:var(--accent)}.setting-row input:disabled{opacity:.4}
  </style>
</head>
<body>
  <main class="app" id="app">
    <video class="camera" id="camera" autoplay muted playsinline aria-label="实时摄像头画面"></video>
    <div class="camera-fallback" id="fallback"><div class="fallback-grid"></div><div class="fallback-copy"><div class="camera-mark">◉</div><strong>让镜头成为你的画布</strong><span>连接摄像头后，将画面作为描摹背景</span></div></div>
    <div class="stage-shade"></div>
    <svg class="guide-grid" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><g fill="none" stroke="rgba(217,243,106,.72)" stroke-width=".35"><path d="M50 35 0 100M50 35 20 100M50 35 40 100M50 35 60 100M50 35 80 100M50 35 100 100M15 50H85M8 67H92M0 84H100M0 100H100"/></g></svg><div class="horizon-line" aria-hidden="true"></div>
    <section class="settings-panel" id="settingsPanel" aria-label="辅助设置" hidden><h2 class="settings-heading">取景辅助</h2><label class="setting-row" for="gridToggle">透视网格<input id="gridToggle" type="checkbox"></label><label class="setting-row" for="horizonToggle">水平线<input id="horizonToggle" type="checkbox"></label><label class="setting-row" for="torchToggle">闪光灯<input id="torchToggle" type="checkbox" disabled></label></section>
    <div class="canvas-hit" id="canvasHit" aria-label="画布，点击添加顺序点位"></div>
    <div class="points-layer" id="pointsLayer" aria-live="polite"></div>
    <header class="topbar"><div class="brand"><span class="brand-symbol">◌</span><span>描绘</span></div><div class="top-actions"><button class="icon-btn" id="cameraBtn" aria-label="连接摄像头" title="连接摄像头"><svg viewBox="0 0 24 24"><path d="M14 5h-4l-1.5 2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3.5L14 5Z"/><circle cx="12" cy="13" r="3.5"/></svg></button><button class="icon-btn" id="clearBtn" aria-label="清除点位" title="清除点位">↺</button><button class="icon-btn" id="settingsBtn" aria-label="设置" aria-expanded="false" title="设置">⚙</button></div></header>
    <div class="center-status" id="status"><span class="status-dot"></span><span id="statusText">摄像头未连接</span></div>
    <aside class="side-rail left"><div class="slider-shell"><span class="rail-label">图片透明度</span><input class="vertical-range" id="opacityRange" type="range" min="10" max="100" value="72" aria-label="图片透明度"><span class="rail-value" id="opacityValue">72%</span><span class="rail-glyph">◐</span></div></aside>
    <aside class="side-rail right"><div class="slider-shell"><span class="rail-label">背景缩放</span><input class="vertical-range" id="bgZoomRange" type="range" min="100" max="180" value="100" aria-label="背景缩放"><span class="rail-value" id="bgZoomValue">1.0×</span><span class="rail-glyph">⌕</span></div></aside>
    <div class="image-layer" id="imageLayer" aria-label="可拖动并缩放的参考图片"><img class="overlay-image" id="overlayImage" alt="导入的描摹参考图"></div><canvas id="warpCanvas" class="warp-canvas" aria-hidden="true"></canvas><div id="perspectiveLayer" class="perspective-layer" aria-label="纸面四角校正控制点"></div>
    <div class="import-empty" id="importEmpty"><button class="import-button" id="importBtn"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.5"/><path d="m5 18 5-5 3 3 2-2 4 4"/></svg>导入参考图片</button><span class="import-hint">选择照片，叠加在镜头画面上描摹</span></div>
    <section class="bottom-panel" aria-label="绘画工具"><div class="panel-top"><div class="panel-title"><strong id="panelTitle">参考图</strong><span id="panelSub">导入图片后开始描摹</span></div><div class="panel-tools"><button class="tool-pill" id="autoBtn" disabled title="自动识别画面中的纸张边缘">找纸</button><button class="tool-pill" id="perspectiveBtn" disabled>纸面校正</button><button class="tool-pill" id="lineBtn" disabled>线稿</button><button class="tool-pill" id="undoBtn" disabled>撤销点位</button></div></div><div class="size-row"><span class="size-icon">小</span><input class="size-range" id="sizeRange" type="range" min="45" max="140" value="100" aria-label="参考图片大小"><span class="size-icon">大</span><span class="size-value" id="sizeValue">100%</span></div><nav class="toolbar" aria-label="主要工具"><button class="action selected" id="galleryBtn"><span class="action-icon"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.5"/><path d="m5 18 5-5 3 3 2-2 4 4"/></svg></span><span>图库</span></button><button class="action capture" id="shutterBtn"><span class="action-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/></svg></span><span>拍摄</span></button><button class="action" id="pointBtn"><span class="action-icon"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18"/><circle cx="12" cy="12" r="8"/></svg></span><span>添加点</span></button><button class="action" id="fitBtn"><span class="action-icon"><svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m13-5h3a2 2 0 0 1 2 2v3M3 16v3a2 2 0 0 0 2 2h3m13-5v3a2 2 0 0 1-2 2h-3"/><path d="m9 9 6 6m0-6-6 6"/></svg></span><span>重置视图</span></button></nav></section>
    <div class="toast" id="toast" role="status"></div><input class="file-input" id="fileInput" type="file" accept="image/*">
  </main>
  <script>
    const $=id=>document.getElementById(id);
    const app=$('app'),camera=$('camera'),fallback=$('fallback'),imageLayer=$('imageLayer'),overlayImage=$('overlayImage'),fileInput=$('fileInput'),pointsLayer=$('pointsLayer');
    let stream=null,originalImage='',lineMode=false,points=[],pointMode=false,scale=1,pos={x:0,y:0},pointerStart=null,pinchStart=null,toastTimer,perspectiveQuad=null,perspectiveEditing=false;
    const warpCanvas=$('warpCanvas'),warpCtx=warpCanvas.getContext('2d');
    const notify=message=>{const toast=$('toast');toast.textContent=message;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),1900)};
    let cameraStarting=false,cameraRequestId=0,pageActive=!document.hidden;
    function pauseCamera(){pageActive=false;cameraRequestId++;cameraStarting=false;if(stream){stream.getTracks().forEach(track=>track.stop());stream=null}camera.srcObject=null;camera.classList.remove('ready');fallback.style.display='grid';$('torchToggle').checked=false;$('torchToggle').disabled=true;$('statusText').textContent='摄像头已暂停'}
    window.pauseCamera=pauseCamera;window.resumeCamera=()=>{pageActive=true;connectCamera()};
    async function connectCamera(){if(!navigator.mediaDevices?.getUserMedia){notify('当前浏览器不支持摄像头访问');return}if(!pageActive||cameraStarting)return;if(stream?.getVideoTracks().some(track=>track.readyState==='live'))return;cameraStarting=true;const requestId=++cameraRequestId;try{const nextStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});if(requestId!==cameraRequestId||!pageActive){nextStream.getTracks().forEach(track=>track.stop());return}stream=nextStream;camera.srcObject=stream;await camera.play();if(requestId!==cameraRequestId||!pageActive)return;camera.classList.add('ready');fallback.style.display='none';$('statusText').textContent='镜头已就绪';$('cameraBtn').style.color='var(--accent)';const track=stream.getVideoTracks()[0],supportsTorch=!!track.getCapabilities?.().torch;$('torchToggle').disabled=!supportsTorch;if(!supportsTorch){$('torchToggle').checked=false;notify('当前摄像头不支持闪光灯控制')}}catch(error){if(requestId===cameraRequestId){if(stream){stream.getTracks().forEach(track=>track.stop());stream=null}camera.srcObject=null;camera.classList.remove('ready');fallback.style.display='grid';$('statusText').textContent='摄像头未连接';notify(error.name==='NotAllowedError'?'请允许浏览器使用摄像头':'无法连接摄像头，请检查设备')}}finally{if(requestId===cameraRequestId)cameraStarting=false}}
    document.addEventListener('visibilitychange',()=>document.hidden?pauseCamera():window.resumeCamera());
    function setFile(file){if(!file)return;if(!file.type.startsWith('image/')){notify('请选择图片文件');return}const reader=new FileReader();reader.onload=()=>{originalImage=reader.result;lineMode=false;perspectiveQuad=null;perspectiveEditing=false;app.classList.remove('perspective-mode','perspective-on');$('perspectiveBtn').disabled=false;$('autoBtn').disabled=false;$('autoBtn').classList.remove('active');$('perspectiveBtn').classList.remove('active');$('perspectiveBtn').textContent='纸面校正';$('perspectiveLayer').replaceChildren();warpCtx.clearRect(0,0,warpCanvas.width,warpCanvas.height);overlayImage.src=originalImage;overlayImage.style.filter='drop-shadow(0 14px 26px rgba(0,0,0,.3))';imageLayer.classList.add('visible');$('importEmpty').classList.add('hidden');$('lineBtn').disabled=false;$('undoBtn').disabled=!points.length;$('panelTitle').textContent='参考图';$('panelSub').textContent='拖动定位 · 双指缩放';scale=1;pos={x:0,y:0};applyTransform();notify('参考图片已载入')};reader.readAsDataURL(file)}
    $('importBtn').onclick=()=>fileInput.click();$('galleryBtn').onclick=()=>fileInput.click();fileInput.onchange=e=>{setFile(e.target.files[0]);fileInput.value=''};
    $('cameraBtn').onclick=connectCamera;
    $('settingsBtn').onclick=()=>{const panel=$('settingsPanel'),open=panel.hidden;panel.hidden=!open;$('settingsBtn').setAttribute('aria-expanded',String(open))};
    $('gridToggle').onchange=e=>app.classList.toggle('show-grid',e.target.checked);
    $('horizonToggle').onchange=e=>app.classList.toggle('show-horizon',e.target.checked);
    $('torchToggle').onchange=async e=>{const track=stream?.getVideoTracks()[0];if(!track){e.target.checked=false;notify('请先连接摄像头');return}try{await track.applyConstraints({advanced:[{torch:e.target.checked}]});notify(e.target.checked?'闪光灯已开启':'闪光灯已关闭')}catch(error){e.target.checked=false;notify('无法控制闪光灯，请检查设备')}};

    async function findPaper(){if(!camera.classList.contains('ready')||camera.videoWidth<2){notify('请先连接摄像头');return}const btn=$('autoBtn');btn.disabled=true;btn.textContent='识别中…';await new Promise(requestAnimationFrame);try{const max=320,ratio=Math.min(1,max/camera.videoWidth),w=Math.max(1,Math.round(camera.videoWidth*ratio)),h=Math.max(1,Math.round(camera.videoHeight*ratio)),canvas=document.createElement('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});canvas.width=w;canvas.height=h;ctx.drawImage(camera,0,0,w,h);const data=ctx.getImageData(0,0,w,h).data,mask=new Uint8Array(w*h);for(let i=0;i<w*h;i++){const k=i*4,r=data[k],g=data[k+1],b=data[k+2],hi=Math.max(r,g,b),lo=Math.min(r,g,b),sat=hi? (hi-lo)/hi:0,y=.299*r+.587*g+.114*b;mask[i]=y>145&&sat<.48?1:0}const seen=new Uint8Array(w*h),queue=new Int32Array(w*h);let best=null,bestScore=0;for(let i=0;i<w*h;i++){if(!mask[i]||seen[i])continue;let head=0,tail=0,minX=w,maxX=0,minY=h,maxY=0;queue[tail++]=i;seen[i]=1;while(head<tail){const p=queue[head++],x=p%w,y=(p/w)|0;minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y);if(x>0){const n=p-1;if(mask[n]&&!seen[n]){seen[n]=1;queue[tail++]=n}}if(x+1<w){const n=p+1;if(mask[n]&&!seen[n]){seen[n]=1;queue[tail++]=n}}if(y>0){const n=p-w;if(mask[n]&&!seen[n]){seen[n]=1;queue[tail++]=n}}if(y+1<h){const n=p+w;if(mask[n]&&!seen[n]){seen[n]=1;queue[tail++]=n}}}const bw=maxX-minX+1,bh=maxY-minY+1,area=tail/(w*h),box=bw*bh/(w*h),fill=tail/Math.max(1,bw*bh),cx=(minX+maxX)/2,cy=(minY+maxY)/2,central=1-Math.min(1,Math.hypot((cx-w/2)/(w*.72),(cy-h/2)/(h*.72))),score=area*Math.sqrt(box)*(.35+.65*fill)*(.65+.35*central);if(area>.025&&box>.06&&fill>.12&&bw>12&&bh>12&&score>bestScore){bestScore=score;best={minX,maxX,minY,maxY,points:[]};for(const[c,maximize]of[[0,false],[1,true],[0,true],[1,false]]){let value=maximize?-Infinity:Infinity,point=null;for(let p=0;p<tail;p++){const id=queue[p],x=id%w,y=(id/w)|0,v=c===0?x+y:x-y;if(maximize?v>value:v<va     $('lineBtn').onclick=async()=>{if(!originalImage)return;const btn=$('lineBtn');btn.disabled=true;btn.textContent='处理中…';try{if(!lineMode){overlayImage.src=await toLineArt(originalImage);lineMode=true;btn.classList.add('active');btn.textContent='还原彩色';$('panelTitle').textContent='线稿模式';notify('已转换为线稿')}else{overlayImage.src=originalImage;lineMode=false;btn.classList.remove('active');btn.textContent='线稿';$('panelTitle').textContent='参考图';notify('已还原原图')}}finally{btn.disabled=false}};
